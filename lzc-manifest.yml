application:
  subdomain: traggo
  multi_instance: false
  # Traggo has its own accounts, so it is exposed directly rather than behind
  # the platform login gate.
  public_path:
    - /
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://traggo:3030/

services:
  traggo:
    # upstream: traggo/server:0.8.3
    image: docker.1ms.run/traggo/server:0.8.3
    environment:
      # Upstream's .env.sample and docker-compose both ship admin/admin. Those
      # names are the override points, so a generated pair replaces them; the
      # account is only created when the database has no user yet.
      - TRAGGO_DEFAULT_USER_NAME={{ .U.admin_username }}
      - |-
        TRAGGO_DEFAULT_USER_PASS={{ .U.admin_password }}
      - TRAGGO_DATABASE_DIALECT=sqlite3
      - TRAGGO_DATABASE_CONNECTION=/opt/traggo/data/traggo.db
      - TRAGGO_LOG_LEVEL=info
      - TZ=Asia/Shanghai
    binds:
      # SQLite database (the only state this app keeps)
      - /lzcapp/var/traggo:/opt/traggo/data

usage: |
  Traggo 是「用标签记工时」的时间追踪工具。和传统按项目分的工具不同，它没有项目层，所有记录靠标签组织——比如给一段时间打上 `project=网站` `client=A公司`，事后想按哪个维度统计都行。

  使用方法：
  1. 打开应用，用安装时设置的用户名和密码登录（密码在安装参数里，默认随机生成）。
  2. 建几个 Tag（标签是 key=value 形式，例如 `project=内部`），然后把它们组合成 Tag Group 方便点选。
  3. 在时间线上开始计时或手动补录时长，挂上对应标签。
  4. 在报表页按任意标签组合查看汇总，也可以导出。

  数据与安全：
  - 数据库是单个 SQLite 文件，存在 /lzcapp/var/traggo，卸载会一并删除。
  - 上游示例配置里内置 admin/admin 这组弱口令，但那是可覆盖的默认值；
    本包改成安装参数的随机密码，**只在数据库还没有用户时创建**，之后重启不会重置。
  - 应用直接对外开放，由 Traggo 自己的登录页鉴权：
    自带账号体系的服务再套一层平台鉴权会造成重复登录，所以用 public_path。

  说明：
  - 单容器 + 内置 SQLite，不需要额外数据库。
  - 界面为英文，暂无中文语言包。
  - 未做真机验证：登录、建标签、记录工时以及重启后数据留存
    均未在设备上实测。
